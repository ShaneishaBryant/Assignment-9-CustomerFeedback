<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunnydale Solutions</title>
    <style>
        #error-box{
            color: #d9534f;
            background-color: #fdf7f7;
            border: 1px solid #d9534f;
            padding: 10px;
            margin-bottom: 15px;
            display: none;
            border-radius: 4px;
        }

        #welcomeback-box {
            color: #0c5460;
            background-color: #d1ecf1;
            border: 1px solid #bee5eb;
            padding: 10px;
            margin-bottom: 15px;
            display: none;
            border-radius: 4px;
        }

    </style>

</head>
<body>
    <div id="welcomeback-box"></div>

    <div id="error-box" role="alert" aria-live="assertive"></div> <!--hold validation messages-->

    <form id="feedback-form">
        <div>
            <label for="reviewer-name">Your Name:</label>
            <input type="text" id="reviewer-name" name="reviewer-name"> 
        </div>

        <br>

        <div>
            <label for="rating">Rate Your Experience</label>
            <select id="rating" name="rating">
                <option value="" disabled selected>Select a rating</option>
                <option value="1">1 Star ⭐️</option>
                <option value="2">2 Star ⭐️⭐️</option>
                <option value="3">3 Star ⭐️⭐️⭐️</option>
                <option value="4">4 Star ⭐️⭐️⭐️⭐️</option>
                <option value="5">5 Star ⭐️⭐️⭐️⭐️⭐️</option>
            </select>
        </div>


        <br>

        <div>
            <label for="comments">Feedback:</label><br>
            <textarea id="comments" name="comments" rows="5" cols="40" placeholder="Write your comments here..."></textarea>

        </div>

        <br>

        <button type="submit">Submit Feedback</button>
    </form>

    <script>
        //select DOM elements 
        const welcomeBackBox = document.getElementById('welcomeback-box');
        const errorBox = document.getElementById('error-box');
        const form = document.getElementById('feedback-form');

        const nameInput = document.getElementById('reviewer-name');
        const ratingInput = document.getElementById('rating');
        const commentsInput = document.getElementById('comments');


        //event listener that runs immediately on page load 
        document.addEventListener('DOMContentLoaded', function (){
            const savedName = localStorage.getItem('reviewerName');
            if (savedName){
                nameInput.value = savedName;

                welcomeBackBox.innerHTML = `Welcome back, ${savedName}! Ready to submit another wonderful review?`;
                welcomeBackBox.style.display = 'block';
            }
        });


        //submit - event listener 
        form.addEventListener('submit', function(event){

            //prevent default browser submission 
            event.preventDefault();

            //clears pervious errors
            errorBox.innerHTML= '';
            errorBox.style.display = 'none';

            //collects errors 
            let errors = [];

            //extract current values at the time of submission 
            const nameValue = nameInput.value.trim();
            const ratingValue = ratingInput.value;
            const commentsValue = commentsInput.value.trim();
            
            //check if name is empty 
            if(!nameValue){
                errors.push("Please provide your name.")
            }
            //check that rating equals 5
            if(ratingValue !== "5"){
                errors.push("Our company standard requires a 5-star rating.")
            }
            //check if comment contains 'wonderful'
            if(!commentsValue.toLowerCase().includes("wonderful")){
                errors.push("Comments must include the word 'wonderful'.")
            }
            //check if errors occured
            if (errors.length > 0) {
                errorBox.innerHTML = errors.join('<br>');
                errorBox.style.display = 'block';
            }else{
                //save reviewer's name to local storage 
                localStorage.setItem("reviewerName", nameValue);

                //hide form submission upon successful submission
                form.style.display = 'none';
                welcomeBackBox.style.display = 'none';

                errorBox.innerHTML = `Thank you, ${nameValue}! Your glowing review has been recorded.`;
                errorBox.style.color = '#155724';
                errorBox.style.backgroundColor = '#d4edda';
                errorBox.style.borderColor = '#c3e6cb';
                errorBox.style.display = 'block';

                console.log('Reviewer Name: ', nameValue);
                console.log('Rating: ', ratingValue);
                console.log('Comments: ', commentsValue);
            }
    });
    </script>
</body>
</html>
